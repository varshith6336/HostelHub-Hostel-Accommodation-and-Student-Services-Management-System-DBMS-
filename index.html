const $=s=>document.querySelector(s);const esc=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(msg){const t=$('#toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600)}
function setPage(page){state.page=page;document.querySelectorAll('.nav-btn').forEach(b=>b.classList.toggle('active',b.dataset.page===page));$('#crumb').textContent=({dashboard:'Dashboard',students:'Student Directory',rooms:'Rooms & Beds',allocations:'Bed Allocations',complaints:'Complaints & Maintenance',visitors:'Visitor Register',reports:'Reports & Analytics'})[page];render()}
document.querySelectorAll('.nav-btn').forEach(b=>b.addEventListener('click',()=>setPage(b.dataset.page)));
$('#today').textContent=new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'});
function head(kicker,title,desc,action=''){return `<div class="page-head"><div><div class="eyebrow">${kicker}</div><h1>${title}</h1><p>${desc}</p></div>${action}</div>`}
function stat(label,num,foot,ico,trend=''){return `<article class="stat"><div class="stat-top"><span>${label}</span><span class="stat-icon">${ico}</span></div><div class="stat-number">${num}</div><div class="stat-foot">${trend?`<span class="${trend==='up'?'up':'down'}">${trend==='up'?'↗':'•'} </span>`:''}${foot}</div></article>`}
function panel(title,subtitle,body,action=''){return `<section class="panel"><div class="panel-head"><div><h2>${title}</h2>${subtitle?`<p>${subtitle}</p>`:''}</div>${action}</div>${body}</section>`}
function badge(status){let c=status==='Active'||status==='Resolved'||status==='Checked out'?'green':status==='Open'||status==='Pending'||status==='Inside campus'?'orange':status==='In Progress'?'blue':'red';return `<span class="badge ${c}">${esc(status)}</span>`}
function studentRows(arr){return arr.map(s=>`<tr><td><div class="student"><div class="mini-avatar">${esc(s.name.split(' ').map(x=>x[0]).join('').slice(0,2))}</div><div><b>${esc(s.name)}</b><small>${esc(s.id)}</small></div></div></td><td>${esc(s.course)}</td><td>${esc(s.year)}</td><td>${esc(s.room)}</td><td>${badge(s.status)}</td></tr>`).join('')}
function dashboard(){let occupied=state.rooms.reduce((a,r)=>a+r.occupied,0),capacity=state.rooms.reduce((a,r)=>a+r.capacity,0),active=state.students.filter(s=>s.status==='Active').length,open=state.complaints.filter(c=>c.status!=='Resolved').length;return `${head('OVERVIEW','Good afternoon, Administrator 👋','Here is what is happening across your hostel today.',`<button class="btn primary" onclick="setPage('students')">＋ Register student</button>`)}<div class="stats">${stat('Registered students',state.students.length,'Student records in system','♙','up')}${stat('Bed occupancy',`${Math.round(occupied/capacity*100)}%`,`${occupied} of ${capacity} beds occupied`,'▤','up')}${stat('Available beds',capacity-occupied,'Across all hostel blocks','⌂')}${stat('Open complaints',open,'Require attention','☷',open?'down':'up')}</div><div class="grid2">${panel('Occupancy overview','Bed utilization by hostel block',`<div class="panel-body"><div class="chart-area">${['Block A','Block B','Block C','Block D','Block E','Block F'].map((x,i)=>{let vals=[78,65,0,0,0,0],v=vals[i];return `<div class="bar-group"><div class="bars"><div class="bar" style="height:${v}%"></div><div class="bar alt" style="height:${Math.max(0,v-12)}%"></div></div><span class="bar-label">${x}</span></div>`}).join('')}</div><div class="legend"><span><i class="dot"></i>Occupied beds</span><span><i class="dot alt"></i>Available capacity</span></div></div>`)}${panel('Room availability','Current capacity status',`<div class="panel-body"><div class="occupancy"><div class="donut"><div class="donut-center"><strong>${Math.round(occupied/capacity*100)}%</strong><span>OCCUPANCY</span></div></div></div><div class="room-legend"><div><small>Occupied beds</small><b>${occupied}</b></div><div><small>Available beds</small><b>${capacity-occupied}</b></div></div></div>`)}</div><div class="grid2">${panel('Recent student records','Latest registered residents',`<div class="table-wrap"><table><thead><tr><th>Student</th><th>Course</th><th>Year</th><th>Room</th><th>Status</th></tr></thead><tbody>${studentRows(state.students.slice(0,4))}</tbody></table></div>`,`<button class="btn" onclick="setPage('students')">View all →</button>`)}${panel('Latest activity','Recent hostel updates',`<div class="panel-body"><div class="activity"><div class="activity-icon">♙</div><div><b>Student directory updated</b><p>${state.students.length} student records currently listed.</p><time>System overview · Today</time></div></div><div class="activity"><div class="activity-icon">☷</div><div><b>${open} complaints need attention</b><p>Review maintenance and student service requests.</p><time>Complaint register</time></div></div><div class="activity"><div class="activity-icon">▤</div><div><b>${capacity-occupied} beds available</b><p>Allocation can be made to rooms with capacity.</p><time>Room inventory</time></div></div></div>`)}</div><div class="footer">HostelHub · DBMS Project 06 · Demonstration data only</div>`}
function studentsPage(){return `${head('RESIDENT MANAGEMENT','Student directory','Register residents and view their hostel details.',`<button class="btn primary" onclick="openStudentForm()">＋ Add student</button>`)}<div class="toolbar"><input class="field search" id="studentSearch" placeholder="Search name, student ID or course…" oninput="filterStudents()"><select class="field" id="studentFilter" onchange="filterStudents()"><option value="all">All statuses</option><option>Active</option><option>Pending</option></select></div>${panel('Registered students',`${state.students.length} student records`, `<div class="table-wrap"><table><thead><tr><th>Student</th><th>Course</th><th>Year</th><th>Room</th><th>Status</th></tr></thead><tbody id="studentTable">${studentRows(state.students)}</tbody></table></div>`) }<div id="studentFormMount"></div><div class="footer">Student information is sample data for demonstration.</div>`}
function filterStudents(){let q=($('#studentSearch')?.value||'').toLowerCase(),f=$('#studentFilter')?.value||'all';let arr=state.students.filter(s=>(f==='all'||s.status===f)&&[s.name,s.id,s.course,s.room].some(v=>v.toLowerCase().includes(q)));$('#studentTable').innerHTML=arr.length?studentRows(arr):`<tr><td colspan="5"><div class="empty">No matching students found.</div></td></tr>`}
function openStudentForm(){let m=$('#studentFormMount');if(!m)return;m.innerHTML=panel('Register new student','Fields marked with * are required',`<div class="panel-body"><form id="studentForm"><div class="form-grid"><div class="form-field"><label>Full name *</label><input class="field" name="name" required placeholder="Enter student name"></div><div class="form-field"><label>Course *</label><select class="field" name="course" required><option value="">Select course</option><option>B.Tech CSE</option><option>B.Tech AI & ML</option><option>B.Tech ECE</option><option>B.Tech IT</option><option>B.Tech EEE</option></select></div><div class="form-field"><label>Academic year *</label><select class="field" name="year"><option>1st Year</option><option>2nd Year</option><option>3rd Year</option><option>4th Year</option></select></div><div class="form-field"><label>Contact number</label><input class="field" name="phone" placeholder="10-digit phone number"></div></div><div class="form-actions"><button type="button" class="btn" onclick="$('#studentFormMount').innerHTML=''">Cancel</button><button class="btn primary" type="submit">Save student</button></div></form></div>`);$('#studentForm').addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));state.students.unshift({id:'STU-'+(1028+state.students.length),name:d.name,course:d.course,year:d.year,room:'—',phone:d.phone||'—',status:'Pending'});render();toast('Student record added to this demo.');});m.scrollIntoView({behavior:'smooth',block:'start'})}
function roomsPage(){let total=state.rooms.reduce((a,r)=>a+r.capacity,0),occ=state.rooms.reduce((a,r)=>a+r.occupied,0);return `${head('ACCOMMODATION','Rooms & beds','View room capacity, sharing type and availability.')}<div class="stats">${stat('Total rooms',state.rooms.length,'Across Block A and Block B','▤')}${stat('Total beds',total,'Registered bed capacity','⌂')}${stat('Occupied',occ,'Currently assigned beds','♙')}${stat('Available',total-occ,'Ready for allocation','✓')}</div><div class="toolbar"><input class="field search" id="roomSearch" placeholder="Search room or block…" oninput="filterRooms()"><select class="field" id="blockFilter" onchange="filterRooms()"><option value="all">All blocks</option><option>Block A</option><option>Block B</option></select></div>${panel('Room inventory','Availability is calculated from occupied and total beds',`<div class="table-wrap"><table><thead><tr><th>Room</th><th>Block</th><th>Sharing type</th><th>Capacity</th><th>Occupied</th><th>Available</th><th>Monthly fee</th><th>Status</th></tr></thead><tbody id="roomTable">${roomRows(state.rooms)}</tbody></table></div>`)}<div class="footer">Illustrative room inventory and fee values.</div>`}
function roomRows(arr){return arr.map(r=>`<tr><td><b>${r.room}</b></td><td>${r.block}</td><td>${r.type}</td><td>${r.capacity}</td><td>${r.occupied}</td><td><b>${r.capacity-r.occupied}</b></td><td>₹${r.fee.toLocaleString('en-IN')}</td><td>${badge(r.occupied===r.capacity?'Full':'Available')}</td></tr>`).join('')}
function filterRooms(){let q=($('#roomSearch')?.value||'').toLowerCase(),b=$('#blockFilter')?.value||'all';let a=state.rooms.filter(r=>(b==='all'||r.block===b)&&`${r.room} ${r.block} ${r.type}`.toLowerCase().includes(q));$('#roomTable').innerHTML=a.length?roomRows(a):`<tr><td colspan="8"><div class="empty">No matching rooms.</div></td></tr>`}
function allocationsPage(){let available=state.rooms.filter(r=>r.occupied<r.capacity);return `${head('BED ASSIGNMENT','Bed allocations','Track student room assignments and available capacity.',`<button class="btn primary" onclick="openAllocationForm()">＋ Allocate bed</button>`)}${panel('Allocation register','Current room assignments',`<div class="table-wrap"><table><thead><tr><th>Student</th><th>Student ID</th><th>Room</th><th>Allocation date</th><th>Status</th></tr></thead><tbody>${state.allocations.map(a=>`<tr><td><b>${esc(a.student)}</b></td><td>${esc(a.id)}</td><td>${esc(a.room)}</td><td>${esc(a.date)}</td><td>${badge(a.status)}</td></tr>`).join('')}</tbody></table></div>`)}<div id="allocationFormMount"></div><div class="footer">Room allocation records in this interactive preview are held in temporary browser memory.</div>`}
function openAllocationForm(){let eligible=state.students.filter(s=>s.status==='Pending'||s.room==='—'),available=state.rooms.filter(r=>r.occupied<r.capacity);let m=$('#allocationFormMount');m.innerHTML=panel('Allocate a bed','Select a student and a room with available capacity',`<div class="panel-body"><form id="allocationForm"><div class="form-grid"><div class="form-field"><label>Student *</label><select class="field" name="student" required>${eligible.length?eligible.map(s=>`<option value="${esc(s.id)}">${esc(s.name)} · ${esc(s.id)}</option>`).join(''):'<option value="">No unallocated students</option>'}</select></div><div class="form-field"><label>Available room *</label><select class="field" name="room" required>${available.map(r=>`<option value="${r.room}">${r.room} · ${r.block} · ${r.capacity-r.occupied} bed(s) free</option>`).join('')}</select></div></div><div class="form-actions"><button type="button" class="btn" onclick="$('#allocationFormMount').innerHTML=''">Cancel</button><button class="btn primary" type="submit" ${!eligible.length||!available.length?'disabled':''}>Confirm allocation</button></div></form></div>`);$('#allocationForm').addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target)),s=state.students.find(x=>x.id===d.student),r=state.rooms.find(x=>x.room===d.room);if(!s||!r||r.occupied>=r.capacity)return toast('Please select a valid available bed.');r.occupied++;s.room=r.room;s.status='Active';state.allocations.unshift({student:s.name,id:s.id,room:r.room,date:new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'}),status:'Active'});render();toast('Bed allocation recorded in this demo.');});m.scrollIntoView({behavior:'smooth',block:'start'})}
function complaintsPage(){return `${head('STUDENT SERVICES','Complaints & maintenance','Record service requests and update their status.',`<button class="btn primary" onclick="openComplaintForm()">＋ New complaint</button>`)}<div class="stats">${stat('Total complaints',state.complaints.length,'Requests logged','☷')}${stat('Open',state.complaints.filter(c=>c.status==='Open').length,'Awaiting action','◷')}${stat('In progress',state.complaints.filter(c=>c.status==='In Progress').length,'Being addressed','⚒')}${stat('Resolved',state.complaints.filter(c=>c.status==='Resolved').length,'Completed requests','✓')}</div>${panel('Complaint register','Use the action to change a complaint status',`<div class="table-wrap"><table><thead><tr><th>Ticket</th><th>Student / room</th><th>Category</th><th>Description</th><th>Priority</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.complaints.map(c=>`<tr><td><b>${c.id}</b><div class="student"><small>${c.date}</small></div></td><td>${esc(c.student)}<small style="display:block;color:var(--muted);margin-top:4px">Room ${esc(c.room)}</small></td><td>${esc(c.category)}</td><td style="white-space:normal;min-width:170px">${esc(c.detail)}</td><td>${badge(c.priority)}</td><td>${badge(c.status)}</td><td>${c.status==='Resolved'?'—':`<button class="btn" onclick="resolveComplaint('${c.id}')">Mark resolved</button>`}</td></tr>`).join('')}</tbody></table></div>`)}<div id="complaintFormMount"></div><div class="footer">Sample complaints. New records remain in this browser demo session.</div>`}
function openComplaintForm(){let opts=state.students.map(s=>`<option>${esc(s.name)}</option>`).join('');let m=$('#complaintFormMount');m.innerHTML=panel('Create a complaint','Enter the request details below',`<div class="panel-body"><form id="complaintForm"><div class="form-grid"><div class="form-field"><label>Student *</label><select class="field" name="student" required>${opts}</select></div><div class="form-field"><label>Category *</label><select class="field" name="category"><option>Electrical</option><option>Plumbing</option><option>Housekeeping</option><option>Internet / Wi-Fi</option><option>Other</option></select></div><div class="form-field"><label>Priority</label><select class="field" name="priority"><option>Low</option><option selected>Medium</option><option>High</option></select></div><div class="form-field"><label>Room number</label><input class="field" name="room" placeholder="e.g. A-102"></div><div class="form-field full"><label>Description *</label><textarea class="field" name="detail" required placeholder="Describe the issue…"></textarea></div></div><div class="form-actions"><button type="button" class="btn" onclick="$('#complaintFormMount').innerHTML=''">Cancel</button><button class="btn primary">Submit complaint</button></div></form></div>`);$('#complaintForm').addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));state.complaints.unshift({id:'CMP-'+String(19+state.complaints.length).padStart(3,'0'),student:d.student,room:d.room||'—',category:d.category,detail:d.detail,priority:d.priority,status:'Open',date:new Date().toLocaleDateString('en-IN',{day:'2-digit',month:'short',year:'numeric'})});render();toast('Complaint submitted in this demo.');});m.scrollIntoView({behavior:'smooth',block:'start'})}
function resolveComplaint(id){let c=state.complaints.find(c=>c.id===id);if(c)c.status='Resolved';render();toast('Complaint marked as resolved.')}
function visitorsPage(){return `${head('GATE REGISTER','Visitor log','Maintain a simple register of hostel visitors.',`<button class="btn primary" onclick="openVisitorForm()">＋ Register visitor</button>`)}${panel('Visitor entries','Sample visitor register',`<div class="table-wrap"><table><thead><tr><th>Visitor</th><th>Visiting student</th><th>Purpose</th><th>Entry time</th><th>Status</th><th>Action</th></tr></thead><tbody>${state.visitors.map((v,i)=>`<tr><td><b>${esc(v.name)}</b></td><td>${esc(v.student)}</td><td>${esc(v.purpose)}</td><td>${esc(v.time)}</td><td>${badge(v.status)}</td><td>${v.status==='Inside campus'?`<button class="btn" onclick="checkoutVisitor(${i})">Check out</button>`:'—'}</td></tr>`).join('')}</tbody></table></div>`)}<div id="visitorFormMount"></div><div class="footer">Demonstration visitor records only.</div>`}
function openVisitorForm(){let m=$('#visitorFormMount');m.innerHTML=panel('Register a visitor','Record visitor and student details',`<div class="panel-body"><form id="visitorForm"><div class="form-grid"><div class="form-field"><label>Visitor name *</label><input class="field" name="name" required></div><div class="form-field"><label>Visiting student *</label><select class="field" name="student">${state.students.map(s=>`<option>${esc(s.name)}</option>`).join('')}</select></div><div class="form-field full"><label>Purpose of visit *</label><input class="field" name="purpose" required placeholder="e.g. Parent meeting"></div></div><div class="form-actions"><button type="button" class="btn" onclick="$('#visitorFormMount').innerHTML=''">Cancel</button><button class="btn primary">Save visitor</button></div></form></div>`);$('#visitorForm').addEventListener('submit',e=>{e.preventDefault();let d=Object.fromEntries(new FormData(e.target));state.visitors.unshift({...d,time:new Date().toLocaleString('en-IN',{day:'2-digit',month:'short',hour:'2-digit',minute:'2-digit'}),status:'Inside campus'});render();toast('Visitor registered in this demo.');});m.scrollIntoView({behavior:'smooth',block:'start'})}
function checkoutVisitor(i){state.visitors[i].status='Checked out';render();toast('Visitor marked as checked out.')}
function reportsPage(){let cap=state.rooms.reduce((a,r)=>a+r.capacity,0),occ=state.rooms.reduce((a,r)=>a+r.occupied,0),fees=state.rooms.reduce((a,r)=>a+r.occupied*r.fee,0);return `${head('INSIGHTS','Reports & analytics','A quick snapshot of accommodation and student services.')}<div class="stats">${stat('Occupancy rate',Math.round(occ/cap*100)+'%',`${occ} of ${cap} beds occupied`,'▤')}${stat('Monthly fee estimate','₹'+fees.toLocaleString('en-IN'),'Based on occupied beds and sample room fees','₹')}${stat('Active residents',state.students.filter(s=>s.status==='Active').length,'Currently allocated students','♙')}${stat('Unresolved requests',state.complaints.filter(c=>c.status!=='Resolved').length,'Open or in-progress complaints','☷')}</div><div class="grid2">${panel('Room occupancy by block','Occupied beds / total beds',`<div class="panel-body">${['Block A','Block B'].map(b=>{let rs=state.rooms.filter(r=>r.block===b),o=rs.reduce((a,r)=>a+r.occupied,0),c=rs.reduce((a,r)=>a+r.capacity,0),pct=Math.round(o/c*100);return `<div style="margin:12px 0 22px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:9px"><b>${b}</b><span style="color:var(--muted)">${o} / ${c} beds · ${pct}%</span></div><div style="height:9px;border-radius:9px;background:var(--panel2);overflow:hidden"><div style="height:100%;width:${pct}%;background:var(--accent);border-radius:9px"></div></div></div>`}).join('')}<p style="font-size:10px;color:var(--muted)">All figures use the sample data currently shown in the demo.</p></div>`)}${panel('Service request summary','Complaint status distribution',`<div class="panel-body">${['Open','In Progress','Resolved'].map(s=>{let n=state.complaints.filter(c=>c.status===s).length,p=state.complaints.length?Math.round(n/state.complaints.length*100):0;return `<div style="margin:12px 0 20px"><div style="display:flex;justify-content:space-between;font-size:12px;margin-bottom:8px"><span>${badge(s)}</span><b>${n} (${p}%)</b></div><div style="height:8px;background:var(--panel2);border-radius:8px;overflow:hidden"><div style="height:100%;width:${p}%;background:${s==='Resolved'?'var(--green)':s==='Open'?'var(--orange)':'var(--accent)'}"></div></div></div>`}).join('')}</div>`)}</div>${panel('Database entities represented','Core tables for the DBMS project',`<div class="panel-body" style="display:flex;gap:9px;flex-wrap:wrap">${['Students','Hostel Blocks','Rooms','Beds','Allocations','Fee Schedules','Payments','Complaints','Maintenance Requests','Visitors','Transfers'].map(t=>`<span class="badge blue" style="padding:8px 10px">${t}</span>`).join('')}</div>`)}<div class="footer">Report values are calculated from in-browser sample records; this preview is not connected to MySQL.</div>`}
function render(){let html=({dashboard,students:studentsPage,rooms:roomsPage,allocations:allocationsPage,complaints:complaintsPage,visitors:visitorsPage,reports:reportsPage})[state.page]();$('#content').innerHTML=html}
render();
</script>
</body>
</html>
